name: Lingua CI
on:
  push:
    paths: ["lingua/**", ".github/workflows/lingua-ci.yml"]
  pull_request:
    paths: ["lingua/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: lingua } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: lingua, POSTGRES_PASSWORD: lingua, POSTGRES_DB: lingua }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lingua" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lingua:lingua@localhost:5432/lingua?schema=public
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-0123
      RATE_LIMIT_AI_PER_MIN: "300"
      ALLOW_REGISTRATION: "true"   # the e2e suite creates its own throw-away accounts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: lingua/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run build
      - name: API end-to-end
        run: |
          npm start &
          npx wait-on http://localhost:3000/login --timeout 60000
          npm run e2e
